name: FizzBee MBT & Engine CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FIZZBEE_VERSION: "0.5.4"
  FIZZBEE_MBT_VERSION: "0.2.0"
  DAFNY_VERSION: "4.11.0"

jobs:
  mbt:
    name: Model Check, Engine Race Tests & FizzBee MBT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache FizzBee & FizzBee-MBT binaries
        id: cache-fizzbee
        uses: actions/cache@v4
        with:
          path: ~/.local/fizzbee-tools
          key: fizzbee-${{ env.FIZZBEE_VERSION }}-mbt-${{ env.FIZZBEE_MBT_VERSION }}-linux_x86

      - name: Install FizzBee & FizzBee-MBT
        if: steps.cache-fizzbee.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          TOOLS_DIR="$HOME/.local/fizzbee-tools"
          mkdir -p "$TOOLS_DIR"

          curl -fsSL \
            "https://github.com/fizzbee-io/fizzbee/releases/download/v${FIZZBEE_VERSION}/fizzbee-v${FIZZBEE_VERSION}-linux_x86.tar.gz" \
            -o /tmp/fizzbee.tar.gz
          tar -xzf /tmp/fizzbee.tar.gz -C "$TOOLS_DIR"
          rm -f /tmp/fizzbee.tar.gz

          curl -fsSL \
            "https://github.com/fizzbee-io/fizzbee-mbt-releases/releases/download/v${FIZZBEE_MBT_VERSION}/fizzbee-mbt-${FIZZBEE_MBT_VERSION}-linux_x86.tar.gz" \
            -o /tmp/fizzbee-mbt.tar.gz
          tar -xzf /tmp/fizzbee-mbt.tar.gz -C "$TOOLS_DIR"
          rm -f /tmp/fizzbee-mbt.tar.gz

      - name: Add FizzBee tools to PATH
        run: |
          TOOLS_DIR="$HOME/.local/fizzbee-tools"
          echo "$TOOLS_DIR/fizzbee-v${FIZZBEE_VERSION}-linux_x86" >> "$GITHUB_PATH"
          echo "$TOOLS_DIR/fizzbee-mbt-${FIZZBEE_MBT_VERSION}-linux_x86" >> "$GITHUB_PATH"

      - name: Cache TLA+ tools (tla2tools + CommunityModules)
        uses: actions/cache@v4
        with:
          path: ~/.local/tla-tools
          key: tla-tools-1.8.0-community-v1

      - name: Cache Lean 4 toolchain (elan v4.16.0)
        id: cache-lean
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-lean-4.16.0-linux-x86_64

      - name: Install Lean 4 (elan)
        if: steps.cache-lean.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.16.0 --no-modify-path
          rm -f /tmp/elan-init.sh

      - name: Add Lean 4 to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Dafny toolchain (v4.11.0)
        id: cache-dafny
        uses: actions/cache@v4
        with:
          path: ~/.local/dafny
          key: dafny-${{ env.DAFNY_VERSION }}-linux-x64

      - name: Install Dafny & goimports
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.local/dafny/dafny" ]; then
            mkdir -p "$HOME/.local"
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://github.com/dafny-lang/dafny/releases/download/v${DAFNY_VERSION}/dafny-${DAFNY_VERSION}-x64-ubuntu-22.04.zip" \
              -o /tmp/dafny.zip
            unzip -q -o /tmp/dafny.zip -d "$HOME/.local"
            rm -f /tmp/dafny.zip
          fi
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Add Dafny & Go bin to PATH
        run: |
          echo "$HOME/.local/dafny" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Dafny Verified Implementation Proofs & Go Codegen Audit (Phase 1 + Phase 2, zero assume)
        run: make dafny

      - name: Unbounded Lean 4 Machine-Checked Proofs (13 theorems, zero sorry)
        run: make prove

      - name: Go vet
        run: |
          go vet ./engine ./engine/core/... ./engine/gocore/... ./verify/... ./cmd/groundkv-dst/...
          go vet -unreachable=false ./engine/verified/... ./cmd/groundkv/...

      - name: Engine unit, crash-recovery, fuzz-seed & race tests
        run: make race

      - name: Deterministic Simulation Testing (7 Swarm profiles, 19 scenario checks & SIGKILL crash recovery)
        run: make dst

      - name: Go-side engine code mutation proofs
        run: make check-code-mutations

      - name: TLA+ protocol model checking & Formal Trace Validation on real Go DST traces
        run: make trace-validate

      - name: Active Go Fuzzing (page decoders & corrupt storage images)
        run: make fuzz

      - name: Model-check all FizzBee specs (safety & liveness)
        run: make FIZZ=fizz check-specs

      - name: Run formal spec mutation checks (4 safety + 1 liveness)
        run: make FIZZ=fizz check-mutations

      - name: Run FizzBee Model-Based Testing (-race + MBT & combined coverage)
        run: make FIZZ=fizz FIZZBEE_MBT_SERVER=fizzbee-mbt-server FIZZBEE_MBT_BIN=fizzbee-mbt-runner mbt-contract mbt-storage-protocol mbt-btree-ops mbt-coverage combined-coverage
